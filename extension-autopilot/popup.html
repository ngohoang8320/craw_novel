<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Bilinovel Auto-Pilot</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        width: 280px;
        padding: 12px;
        font-size: 13px;
        color: #1f2937;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 10px;
      }
      .run {
        margin-bottom: 10px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e5e7eb;
      }
      .run:last-child {
        border-bottom: none;
      }
      .row {
        margin-bottom: 4px;
      }
      .label {
        color: #6b7280;
      }
      .value {
        font-weight: 600;
      }
      .error-message {
        color: #b91c1c;
        margin-bottom: 4px;
      }
      button {
        width: 100%;
        padding: 6px;
        margin-top: 4px;
        cursor: pointer;
        border: 1px solid #fecaca;
        border-radius: 6px;
        background: #fee2e2;
        color: #991b1b;
        font-weight: 600;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      button.secondary-btn {
        border: 1px solid #d1d5db;
        background: #f3f4f6;
        color: #374151;
      }
      #empty {
        color: #6b7280;
      }
      details {
        margin-top: 12px;
        border-top: 1px solid #e5e7eb;
        padding-top: 8px;
      }
      summary {
        cursor: pointer;
        font-weight: 600;
        color: #6b7280;
      }
      #historyContent {
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <h1>Bilinovel Auto-Pilot</h1>
    <div id="content">
      <p id="empty">No active run right now - use "Sync to Auto-Pilot" in the web app first.</p>
    </div>
    <details id="historySection" hidden>
      <summary>History (<span id="historyCount">0</span>)</summary>
      <div id="historyContent"></div>
      <button id="clearHistoryBtn" class="secondary-btn">Clear history</button>
    </details>
    <script src="popup.js"></script>
  </body>
</html>
